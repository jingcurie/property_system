<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>自选股智能买卖决策（纯前端 · A股）</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --muted: #94a3b8;
        --text: #e2e8f0;
        --border: #1f2937;
        --indigo: #6366f1;
        --rise: #ef4444;
        --fall: #10b981;
      }
      html,
      body {
        background: var(--bg);
        color: var(--text);
        margin: 0;
        font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial, "Noto Sans";
      }
      .container {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .title {
        font-size: 20px;
        font-weight: 700;
      }
      .muted {
        color: var(--muted);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      }
      .card-body {
        padding: 16px;
      }
      .flex {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .grow {
        flex: 1;
      }
      input[type="text"] {
        background: #0b1220;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        width: 100%;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
      }
      th {
        font-weight: 600;
        color: #cbd5e1;
        text-align: left;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 10px;
        font-weight: 600;
        font-size: 12px;
      }
      .b-buy {
        background: rgba(239, 68, 68, 0.15);
        color: #fecaca;
        border: 1px solid rgba(239, 68, 68, 0.35);
      } /* 买入=红 */
      .b-sell {
        background: rgba(16, 185, 129, 0.15);
        color: #86efac;
        border: 1px solid rgba(16, 185, 129, 0.35);
      } /* 卖出=绿 */
      .b-hold {
        background: rgba(245, 158, 11, 0.15);
        color: #fde68a;
        border: 1px solid rgba(245, 158, 11, 0.35);
      }
      .b-watch {
        background: rgba(59, 130, 246, 0.15);
        color: #93c5fd;
        border: 1px solid rgba(59, 130, 246, 0.35);
      }
      .btn {
        background: linear-gradient(135deg, var(--indigo), #0ea5e9);
        color: #fff;
        border: 0;
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 700;
      }
      .btn:disabled {
        opacity: 0.6;
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: #cbd5e1;
        font-size: 12px;
      }
      .rise {
        color: var(--rise);
      }
      .fall {
        color: var(--fall);
      }
      .foot {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .reasons {
        list-style: disc;
        padding-left: 18px;
        margin: 0;
      }
      .x {
        cursor: pointer;
        color: #94a3b8;
      }
      .x:hover {
        color: #e5e7eb;
      }
      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: #111827;
        border: 1px solid #374151;
        padding: 12px 14px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        display: none;
      }
      .sub {
        margin-top: 14px;
      }
      .k {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="toolbar">
        <div>
          <div class="title">
            自选股智能买卖决策
            <span class="pill" id="marketState">加载中…</span>
          </div>
          <div class="muted" id="asof">—</div>
        </div>
        <div class="grow">
          <div class="flex">
            <input
              type="text"
              id="addInput"
              placeholder="输入股票：如 603338 或 300750.SZ"
            />
            <button class="btn" id="addBtn">加入自选</button>
            <button class="btn" id="refreshBtn">立即刷新</button>
            <button class="btn" id="btwBtn">一周回测（¥10,000）</button>
          </div>
          <div class="hint">
            提示：6 开头默认上交所.SH；0/3 开头默认深交所.SZ。
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="muted" style="margin-bottom: 8px">
            仅基于技术面：EMA20 / SMA50 / SMA200 / RSI14 / MACD（日线）。Ajax
            多源回退，红涨绿跌。
          </div>
          <div style="overflow: auto">
            <table id="grid">
              <thead>
                <tr>
                  <th>代码</th>
                  <th>名称</th>
                  <th class="num">现价</th>
                  <th class="num">涨跌幅（今日/昨日）</th>
                  <th>结论</th>
                  <th>理由</th>
                  <th>买入区间 / 卖出区间</th>
                  <th>关键指标</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="foot">
            * 本页仅供参考，非投资建议；未考虑法定节假日休市。
          </div>

          <div id="btw" class="sub"></div>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
      /* ================= 自选保存 ================= */
      const LS_KEY = "watchlist.cnA.v6";
      const DEFAULTS = [
        { symbol: "603338.SH", name: "浙江鼎力" },
        { symbol: "300093.SZ", name: "*ST金刚", st: true },
        { symbol: "600519.SH", name: "贵州茅台" },
        { symbol: "300750.SZ", name: "宁德时代" },
        { symbol: "510300.SH", name: "沪深300ETF" },
      ];
      function loadWatchlist() {
        try {
          const a = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
          return Array.isArray(a) && a.length ? a : DEFAULTS;
        } catch (_) {
          return DEFAULTS;
        }
      }
      function saveWatchlist(a) {
        localStorage.setItem(LS_KEY, JSON.stringify(a));
      }
      let WATCHLIST = loadWatchlist();

      /* ================= 策略参数 ================= */
      const RULES = {
        emaShort: 20,
        smaMid: 50,
        smaLong: 200,
        rsiPeriod: 14,
        rsiOB: 75,
        rsiOS: 25,
        volBurst: 1.3,
      };

      /* ================= DOM/Toast ================= */
      const tbody = document.getElementById("tbody");
      const asof = document.getElementById("asof");
      const marketState = document.getElementById("marketState");
      const toast = document.getElementById("toast");
      const btwBox = document.getElementById("btw");
      function showToast(msg, ok = true) {
        toast.textContent = msg;
        toast.style.display = "block";
        toast.style.borderColor = ok ? "#16a34a" : "#dc2626";
        setTimeout(() => (toast.style.display = "none"), 2200);
      }

      /* ================= 工具 ================= */
      // 带超时 + cache bust
      function fetchWithTimeout(url, opts = {}, ms = 8000) {
        const ctrl = new AbortController();
        const id = setTimeout(() => ctrl.abort(), ms);
        const bust = (url.includes("?") ? "&" : "?") + `_=${Date.now()}`;
        return fetch(url + bust, { ...opts, signal: ctrl.signal }).finally(() =>
          clearTimeout(id)
        );
      }
      function parseInput(raw) {
        raw = (raw || "").trim().toUpperCase();
        if (!raw) return null;
        if (/^(\d{6})\.(SH|SZ)$/.test(raw)) return raw;
        const m = raw.match(/^(\d{6})$/);
        if (!m) return null;
        const code = m[1];
        const ex = code[0] === "6" || code[0] === "5" ? "SH" : "SZ";
        return `${code}.${ex}`;
      }
      function secid(symbol) {
        const [code, ex] = symbol.split(".");
        return (ex === "SH" ? "1." : "0.") + code;
      }
      function toTencent(symbol) {
        const [code, ex] = symbol.split(".");
        return (ex === "SH" ? "sh" : "sz") + code;
      }

      // 统一以 Asia/Shanghai 判定时段，避免双重偏移
      function cnNow() {
        return new Date();
      }
      function marketStateInfo() {
        const tz = "Asia/Shanghai";
        const now = new Date();
        const parts = new Intl.DateTimeFormat("zh-CN", {
          timeZone: tz,
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
        }).formatToParts(now);
        const hhmm =
          +parts.find((p) => p.type === "hour").value * 100 +
          +parts.find((p) => p.type === "minute").value;
        const d = new Date(
          now.toLocaleString("en-US", { timeZone: tz })
        ).getDay();
        let state = "休市";
        if (d >= 1 && d <= 5) {
          if (hhmm < 930) state = "未开盘";
          else if (hhmm < 1130) state = "交易中";
          else if (hhmm < 1300) state = "午休";
          else if (hhmm < 1500) state = "交易中";
          else state = "已收盘";
        }
        const ts = new Intl.DateTimeFormat("zh-CN", {
          timeZone: tz,
          hour12: false,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        }).format(now);
        return { state, ts };
      }

      /* ========== 行情 & K线（东财优先，失败回退腾讯） ========== */
      async function fetchQuote(symbol) {
        const url = `https://push2.eastmoney.com/api/qt/stock/get?secid=${secid(
          symbol
        )}&fields=f57,f58,f43,f44,f45,f46,f60,f168,f47,f48`;
        const r = await fetchWithTimeout(url, {
          headers: { Accept: "application/json" },
        });
        if (!r.ok) throw new Error("行情接口异常");
        const j = await r.json();
        const d = j?.data;
        if (!d || !d.f58) throw new Error("无此股票或数据不可用");
        return {
          symbol,
          code: d.f57,
          name: d.f58,
          price: d.f43 / 100,
          high: d.f44 / 100,
          low: d.f45 / 100,
          open: d.f46 / 100,
          prev: d.f60 / 100,
          pct: d.f168 / 100,
          vol: d.f47,
          amt: d.f48,
        };
      }

      async function fetchKline(symbol, limit = 260) {
        // 东财
        const urlA = `https://push2his.eastmoney.com/api/qt/stock/kline/get?ut=fa5fd1943c7b386f172d6893dbfba10b&secid=${secid(
          symbol
        )}&klt=101&fqt=1&lmt=${limit}&fields1=f1,f2,f3,f4&fields2=f51,f52,f53,f54,f55,f56,f59,f60,f61,f62,f63`;
        try {
          const r = await fetchWithTimeout(urlA);
          if (r.ok) {
            const j = await r.json();
            const arr = j?.data?.klines || [];
            if (arr.length) {
              return arr.map((s) => {
                const [date, open, close, high, low, vol, amt] = s.split(",");
                return {
                  date,
                  open: +open,
                  close: +close,
                  high: +high,
                  low: +low,
                  vol: +vol,
                  amt: +amt,
                };
              });
            }
          }
        } catch (_) {}
        // 腾讯回退
        const tc = toTencent(symbol);
        const urlB = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${tc},day,,,${limit},qfq`;
        const r2 = await fetchWithTimeout(urlB);
        if (!r2.ok) throw new Error("K线接口异常");
        const j2 = await r2.json();
        const rows = j2?.data?.[tc]?.day || j2?.data?.[tc]?.qfqday || [];
        if (!rows.length) throw new Error("K线不可用");
        return rows.map(([date, open, close, high, low, vol]) => ({
          date,
          open: +open,
          close: +close,
          high: +high,
          low: +low,
          vol: +vol,
          amt: 0,
        }));
      }

      /* ================= 指标 ================= */
      function sma(v, p) {
        if (v.length < p) return NaN;
        const s = v.slice(-p);
        return s.reduce((a, b) => a + b, 0) / s.length;
      }
      function ema(v, p) {
        if (v.length < p) return NaN;
        const k = 2 / (p + 1);
        let e = v.slice(0, p).reduce((a, b) => a + b, 0) / p;
        for (let i = p; i < v.length; i++) e = v[i] * k + e * (1 - k);
        return e;
      }
      function rsi(v, p = 14) {
        if (v.length <= p) return 50;
        let g = 0,
          l = 0;
        for (let i = v.length - p; i < v.length; i++) {
          const d = v[i] - v[i - 1];
          if (d > 0) g += d;
          else l += -d;
        }
        const rs = l === 0 ? 100 : g / l;
        return 100 - 100 / (1 + rs);
      }
      function macd(v, fast = 12, slow = 26, sig = 9) {
        const emaS = (a, p) => {
          const k = 2 / (p + 1),
            o = [];
          o[0] = a[0];
          for (let i = 1; i < a.length; i++)
            o[i] = a[i] * k + o[i - 1] * (1 - k);
          return o;
        };
        if (v.length < slow + sig) return { macd: 0, signal: 0, hist: 0 };
        const ef = emaS(v, fast),
          es = emaS(v, slow);
        const line = v.map((_, i) => (ef[i] ?? 0) - (es[i] ?? 0));
        const sg = emaS(line, sig);
        return {
          macd: line.at(-1),
          signal: sg.at(-1),
          hist: line.at(-1) - sg.at(-1),
        };
      }
      function atr(rows, p = 14) {
        if (rows.length <= p) return NaN;
        const trs = [];
        for (let i = 1; i < rows.length; i++) {
          const h = rows[i].high,
            l = rows[i].low,
            pc = rows[i - 1].close;
          trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
        }
        if (trs.length < p) return NaN;
        const s = trs.slice(-p);
        return s.reduce((a, b) => a + b, 0) / s.length;
      }

      /* ========== 判定（在给定索引处做决策） ========== */
      function decideAt(kline, idx) {
        const closes = kline.slice(0, idx + 1).map((r) => r.close);
        const vols = kline.slice(0, idx + 1).map((r) => r.vol);
        const last = closes.at(-1);
        const ema20 = ema(closes, RULES.emaShort),
          sma50 = sma(closes, RULES.smaMid),
          sma200 = sma(closes, RULES.smaLong);
        const rsi14 = rsi(closes, RULES.rsiPeriod);
        const { macd: macdV, signal: macdSig } = macd(closes);
        const avgVol5 = vols.slice(-5).reduce((a, b) => a + b, 0) / 5;
        const volBurst = vols.at(-1) > avgVol5 * RULES.volBurst;
        let level = "HOLD";
        if (last > ema20 && ema20 > sma50) level = "BUY";
        if (last < ema20 && (macdV < macdSig || ema20 < sma50)) level = "SELL";
        if (rsi14 >= RULES.rsiOB && level !== "SELL") level = "HOLD";
        if (rsi14 <= RULES.rsiOS && level === "SELL") level = "WATCH";
        return { level, volBurst };
      }

      /* ================= 实时渲染 ================= */
      async function render() {
        const ms = marketStateInfo();
        marketState.textContent = `${ms.state} · 北京时间 ${
          ms.ts.split(" ")[1] || ms.ts
        }`;
        asof.textContent = `刷新时间：${new Date().toLocaleString()}`;
        tbody.innerHTML = "";
        let err = 0;
        await Promise.all(
          WATCHLIST.map((it) => renderOne(it, ms.state).catch(() => err++))
        );
        if (err) showToast(`有 ${err} 条加载失败`, false);
      }

      async function renderOne(item, state) {
        const tr = document.createElement("tr");
        tbody.appendChild(tr);
        try {
          const [q, kl] = await Promise.all([
            fetchQuote(item.symbol),
            fetchKline(item.symbol, 260),
          ]);
          item.name = item.name || q.name;
          saveWatchlist(WATCHLIST);

          // 涨跌显示：今日（盘中用） / 昨日（K线推算）
          let todayStr = "—",
            todayCls = "";
          if (state === "交易中") {
            const tchg = (((q.price - q.prev) / q.prev) * 100).toFixed(2);
            todayStr = `${(+tchg).toFixed(2)}%`;
            todayCls = +tchg >= 0 ? "rise" : "fall";
          }
          let ydayStr = "—",
            yCls = "";
          if (kl.length >= 2) {
            const last = kl.at(-1).close,
              prev = kl.at(-2).close;
            const y = (((last - prev) / prev) * 100).toFixed(2);
            ydayStr = `${y}%`;
            yCls = +y >= 0 ? "rise" : "fall";
          }

          // 决策 + 区间（最新bar）
          const closes = kl.map((r) => r.close);
          const last = closes.at(-1);
          const ema20 = ema(closes, RULES.emaShort),
            sma50 = sma(closes, RULES.smaMid),
            sma200 = sma(closes, RULES.smaLong);
          const rsi14 = rsi(closes, RULES.rsiPeriod);
          const { macd: macdV, signal: macdSig } = macd(closes);
          let level = "HOLD",
            badge = "b-hold",
            label = "继续持有",
            reasons = [];
          if (last > ema20 && ema20 > sma50) {
            level = "BUY";
            badge = "b-buy";
            label = "建议买入";
            reasons.push("价格>EMA20 且 20>50");
          }
          if (last < ema20 && (macdV < macdSig || ema20 < sma50)) {
            level = "SELL";
            badge = "b-sell";
            label = "建议卖出";
            reasons.push("跌破EMA20 & 动能转弱");
          }
          if (rsi14 >= RULES.rsiOB) {
            if (level !== "SELL") {
              level = "HOLD";
              badge = "b-hold";
              label = "考虑减仓";
            }
            reasons.push("RSI超买");
          }
          if (rsi14 <= RULES.rsiOS) {
            if (level === "SELL") {
              level = "WATCH";
              badge = "b-watch";
              label = "观望";
            }
            reasons.push("RSI超卖");
          }

          const recentHigh = Math.max(...closes.slice(-20));
          const recentLow = Math.min(...closes.slice(-20));
          const a = atr(kl, 14) || 0;

          const buyLow = Math.max(recentLow, ema20 - 0.5 * a);
          const buyHigh = Math.min(ema20, last);

          let sellLow, sellHigh;
          if (level === "SELL") {
            sellLow = Math.max(last * 0.98, ema20 - a);
            sellHigh = Math.max(last, ema20 - 0.3 * a);
          } else {
            sellLow = recentHigh * 0.99;
            sellHigh = recentHigh * 1.01;
          }

          tr.innerHTML = `
      <td>${item.symbol}${item.st ? ' <span class="pill">ST</span>' : ""}</td>
      <td>${item.name || ""}</td>
      <td class="num">${(q.price || 0).toFixed(2)}</td>
      <td class="num">今日：<b class="${todayCls}">${todayStr}</b><br>昨日：<b class="${yCls}">${ydayStr}</b></td>
      <td><span class="badge ${badge}">${label}</span></td>
      <td><ul class="reasons">${reasons
        .slice(0, 3)
        .map((r) => `<li>${r}</li>`)
        .join("")}</ul></td>
      <td class="muted">买：<b>${round2(buyLow)}</b> — <b>${round2(
            buyHigh
          )}</b><br/>卖：<b>${round2(sellLow)}</b> — <b>${round2(
            sellHigh
          )}</b></td>
      <td class="muted k">EMA20 <b>${round2(ema20)}</b> · SMA50 <b>${round2(
            sma50
          )}</b> · SMA200 <b>${round2(sma200)}</b> · RSI14 <b>${round1(
            rsi14
          )}</b> · MACD <b>${round3(macdV)}</b> · ATR14 <b>${round2(a)}</b></td>
      <td class="num"><span class="x" title="移除" data-symbol="${
        item.symbol
      }">✕</span></td>
    `;
        } catch (e) {
          tr.innerHTML = `<td colspan="9" class="fall">${
            item.symbol
          } 加载失败：${e.message || e}</td>`;
        }
      }

      /* ========== 一周回测（等权；信号日次日开盘成交；忽略手续费/滑点） ========== */
      async function backtestWeek(total = 10000) {
        if (!WATCHLIST.length) {
          btwBox.innerHTML =
            '<div class="muted">自选列表为空，无法回测。</div>';
          return;
        }
        btwBox.innerHTML = '<div class="muted">回测计算中…</div>';

        const each = total / WATCHLIST.length;
        let totalEnd = 0,
          totalBH = 0;
        let head, tail;
        const rows = [];

        for (const it of WATCHLIST) {
          try {
            const kl = await fetchKline(it.symbol, 260);
            if (kl.length < 60) throw new Error("历史不足");
            const L = kl.length;
            const endIdx = L - 1; // 期末（最新一根）
            const startIdx = L - 6; // 过去 5 个交易日（含末日）
            head = head || kl[startIdx].date;
            tail = tail || kl[endIdx].date;

            // 基准：周初开盘买、周末收盘卖
            const bhBuy = kl[startIdx].open,
              bhSell = kl[endIdx].close;
            const bhEnd = each * (bhSell / bhBuy);
            totalBH += bhEnd;

            // 策略：信号日收盘判定，次日开盘成交
            let cash = each,
              shares = 0,
              trades = [];
            for (let i = startIdx; i < endIdx; i++) {
              const sig = decideAt(kl, i).level;
              const px = kl[i + 1].open;
              if (shares === 0 && sig === "BUY") {
                shares = Math.floor(cash / px);
                if (shares > 0) {
                  cash -= shares * px;
                  trades.push({
                    date: kl[i + 1].date,
                    act: "买入",
                    price: px,
                    shares,
                  });
                }
              } else if (shares > 0 && sig === "SELL") {
                cash += shares * px;
                trades.push({
                  date: kl[i + 1].date,
                  act: "卖出",
                  price: px,
                  shares,
                });
                shares = 0;
              }
            }
            const endVal = cash + shares * kl[endIdx].close;
            totalEnd += endVal;

            rows.push({
              symbol: it.symbol,
              name: it.name || "",
              begin: each,
              end: endVal,
              bh: bhEnd,
              trades,
              start: kl[startIdx].date,
              endDate: kl[endIdx].date,
            });
          } catch (err) {
            rows.push({
              symbol: it.symbol,
              name: it.name || "",
              error: err.message || String(err),
            });
          }
        }

        const fmt = (n) =>
          n == null ? "—" : (Math.round(n * 100) / 100).toFixed(2);
        const pct = (a, b) =>
          b ? (((a - b) / b) * 100).toFixed(2) + "%" : "—";

        const html = `
    <div class="k">回测区间：<b>${head || "-"}</b> → <b>${
          tail || "-"
        }</b> · 总本金 ¥${fmt(total)} · 等权</div>
    <div style="overflow:auto;margin-top:8px">
      <table style="width:100%">
        <thead><tr>
          <th>代码</th><th>名称</th><th class="num">期初(¥)</th><th class="num">期末(¥)</th><th class="num">收益</th><th class="num">基准期末(¥)</th><th class="num">相对基准</th><th>成交</th>
        </tr></thead>
        <tbody>
          ${rows
            .map((r) =>
              r.error
                ? `<tr><td>${r.symbol}</td><td>${r.name}</td><td colspan="6" class="fall">回测失败：${r.error}</td></tr>`
                : `<tr>
                <td>${r.symbol}</td>
                <td>${r.name}</td>
                <td class="num">${fmt(r.begin)}</td>
                <td class="num ${r.end >= r.begin ? "rise" : "fall"}">${fmt(
                    r.end
                  )}</td>
                <td class="num ${r.end >= r.begin ? "rise" : "fall"}">${pct(
                    r.end,
                    r.begin
                  )}</td>
                <td class="num">${fmt(r.bh)}</td>
                <td class="num ${r.end >= r.bh ? "rise" : "fall"}">${pct(
                    r.end,
                    r.bh
                  )}</td>
                <td class="k">${
                  (r.trades || [])
                    .map(
                      (t) => `${t.date} ${t.act}@${fmt(t.price)}×${t.shares}`
                    )
                    .join("，") || "—"
                }</td>
              </tr>`
            )
            .join("")}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2"><b>组合合计</b></td>
            <td class="num">${fmt(total)}</td>
            <td class="num ${totalEnd >= total ? "rise" : "fall"}">${fmt(
          totalEnd
        )}</td>
            <td class="num ${totalEnd >= total ? "rise" : "fall"}">${pct(
          totalEnd,
          total
        )}</td>
            <td class="num">${fmt(totalBH)}</td>
            <td class="num ${totalEnd >= totalBH ? "rise" : "fall"}">${pct(
          totalEnd,
          totalBH
        )}</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="muted">假设：等权分配，忽略手续费与滑点；信号以“当日收盘”判定，<u>次日开盘价</u>成交；期末按最新收盘价估值。基准为“周初开盘买入、周末收盘卖出”。</div>
  `;
        btwBox.innerHTML = html;
      }

      /* ================= 小工具 ================= */
      const round1 = (x) => Math.round(x * 10) / 10,
        round2 = (x) => Math.round(x * 100) / 100,
        round3 = (x) => Math.round(x * 1000) / 1000;

      /* ================= 交互 ================= */
      const addBtn = document.getElementById("addBtn");
      const addInput = document.getElementById("addInput");
      addBtn.addEventListener("click", onAdd);
      addInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") onAdd();
      });
      document.addEventListener("click", (e) => {
        if (e.target.matches(".x[data-symbol]")) {
          const sym = e.target.getAttribute("data-symbol");
          WATCHLIST = WATCHLIST.filter((it) => it.symbol !== sym);
          saveWatchlist(WATCHLIST);
          showToast(`已从自选移除：${sym}`);
          render();
        }
      });
      async function onAdd() {
        const parsed = parseInput(addInput.value);
        if (!parsed) {
          showToast(
            "代码格式错误：请输入 6 位代码，或 600519.SH / 300750.SZ",
            false
          );
          return;
        }
        if (WATCHLIST.some((it) => it.symbol === parsed)) {
          showToast("该股票已在自选中");
          return;
        }
        try {
          const q = await fetchQuote(parsed); // 校验代码有效
          WATCHLIST.unshift({ symbol: parsed, name: q.name });
          saveWatchlist(WATCHLIST);
          showToast(`已加入：${q.name}（${parsed}）`);
          addInput.value = "";
          render();
        } catch (err) {
          showToast(err.message || "该代码不存在或暂不可用", false);
        }
      }

      const btn = document.getElementById("refreshBtn");
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "刷新中…";
        await render();
        btn.disabled = false;
        btn.textContent = "立即刷新";
      });
      const btwBtn = document.getElementById("btwBtn");
      btwBtn.addEventListener("click", async () => {
        btwBtn.disabled = true;
        btwBtn.textContent = "回测中…";
        await backtestWeek(10000);
        btwBtn.disabled = false;
        btwBtn.textContent = "一周回测（¥10,000）";
      });

      render();
      setInterval(render, 60 * 1000);
    </script>
  </body>
</html>
