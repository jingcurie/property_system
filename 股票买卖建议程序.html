<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>自选股智能买卖决策（纯前端 · A股）</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --muted: #94a3b8;
        --text: #e2e8f0;
        --green: #10b981;
        --red: #ef4444;
        --amber: #f59e0b;
        --blue: #3b82f6;
        --border: #1f2937;
        --indigo: #6366f1;
      }
      html,
      body {
        background: var(--bg);
        color: var(--text);
        margin: 0;
        font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial, "Noto Sans";
      }
      .container {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .title {
        font-size: 20px;
        font-weight: 700;
      }
      .muted {
        color: var(--muted);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      }
      .card-body {
        padding: 16px;
      }
      .flex {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .grow {
        flex: 1;
      }
      input[type="text"] {
        background: #0b1220;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        width: 100%;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
      }
      th {
        font-weight: 600;
        color: #cbd5e1;
        text-align: left;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 10px;
        font-weight: 600;
        font-size: 12px;
      }
      .b-buy {
        background: rgba(16, 185, 129, 0.15);
        color: #ef4444;
        border: 1px solid rgba(16, 185, 129, 0.35);
      }
      .b-sell {
        background: rgba(239, 68, 68, 0.15);
        color: #10b981;
        border: 1px solid rgba(239, 68, 68, 0.35);
      }
      .b-hold {
        background: rgba(245, 158, 11, 0.15);
        color: #fde68a;
        border: 1px solid rgba(245, 158, 11, 0.35);
      }
      .b-watch {
        background: rgba(59, 130, 246, 0.15);
        color: #93c5fd;
        border: 1px solid rgba(59, 130, 246, 0.35);
      }
      .btn {
        background: linear-gradient(135deg, var(--indigo), #0ea5e9);
        color: white;
        border: 0;
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 700;
      }
      .btn:disabled {
        opacity: 0.6;
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: #cbd5e1;
        font-size: 12px;
      }
      .ok {
        color: #ef4444;
      }
      .err {
        color: #10b981;
      }
      .foot {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .reasons {
        list-style: disc;
        padding-left: 18px;
        margin: 0;
      }
      .x {
        cursor: pointer;
        color: #94a3b8;
      }
      .x:hover {
        color: #e5e7eb;
      }
      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: #111827;
        border: 1px solid #374151;
        padding: 12px 14px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="toolbar">
        <div>
          <div class="title">
            自选股智能买卖决策
            <span class="pill" id="marketState">加载中…</span>
          </div>
          <div class="muted" id="asof">—</div>
        </div>
        <div class="grow">
          <div class="flex">
            <input
              type="text"
              id="addInput"
              placeholder="输入股票：如 603338 或 300750.SZ"
            />
            <button class="btn" id="addBtn">加入自选</button>
            <button class="btn" id="refreshBtn">立即刷新</button>
          </div>
          <div class="hint">
            提示：6 开头默认上交所.SH；0/3 开头默认深交所.SZ。
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="muted" style="margin-bottom: 8px">
            仅基于技术面：EMA20 / SMA50 / SMA200 / RSI14 / MACD，实时 Ajax。
          </div>
          <div style="overflow: auto">
            <table id="grid">
              <thead>
                <tr>
                  <th>代码</th>
                  <th>名称</th>
                  <th class="num">现价</th>
                  <th class="num">涨跌幅</th>
                  <th>结论</th>
                  <th>理由</th>
                  <th>买入区间 / 卖出区间</th>
                  <th>关键指标</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="foot">* 本页仅供参考，非投资建议。</div>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
      /********* 自选保存 *********/
      const LS_KEY = "watchlist.cnA.v3";
      const DEFAULTS = [
        { symbol: "603338.SH", name: "浙江鼎力" },
        { symbol: "300093.SZ", name: "*ST金刚", st: true },
        { symbol: "600519.SH", name: "贵州茅台" },
        { symbol: "300750.SZ", name: "宁德时代" },
        { symbol: "510300.SH", name: "沪深300ETF" },
      ];
      function loadWatchlist() {
        try {
          const a = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
          return Array.isArray(a) && a.length ? a : DEFAULTS;
        } catch {
          return DEFAULTS;
        }
      }
      function saveWatchlist(a) {
        localStorage.setItem(LS_KEY, JSON.stringify(a));
      }
      let WATCHLIST = loadWatchlist();

      /********* 策略参数 *********/
      const RULES = {
        emaShort: 20,
        smaMid: 50,
        smaLong: 200,
        rsiPeriod: 14,
        rsiOB: 75,
        rsiOS: 25,
        volBurst: 1.3,
      };

      /********* DOM *********/
      const tbody = document.getElementById("tbody");
      const asof = document.getElementById("asof");
      const marketState = document.getElementById("marketState");
      const toast = document.getElementById("toast");
      function showToast(msg, ok = true) {
        toast.textContent = msg;
        toast.style.display = "block";
        toast.style.borderColor = ok ? "#16a34a" : "#dc2626";
        setTimeout(() => (toast.style.display = "none"), 2600);
      }

      /********* 工具 *********/
      function fetchWithTimeout(url, opts = {}, ms = 7000) {
        const c = new AbortController();
        const id = setTimeout(() => c.abort(), ms);
        const bust = (url.includes("?") ? "&" : "?") + `_=${Date.now()}`;
        return fetch(url + bust, { ...opts, signal: c.signal }).finally(() =>
          clearTimeout(id)
        );
      }
      function parseInput(raw) {
        raw = (raw || "").trim().toUpperCase();
        if (!raw) return null;
        if (/^(\d{6})\.(SH|SZ)$/.test(raw)) return raw;
        const m = raw.match(/^(\d{6})$/);
        if (!m) return null;
        const code = m[1];
        const ex = code[0] === "6" || code[0] === "5" ? "SH" : "SZ";
        return `${code}.${ex}`;
      }
      function secid(symbol) {
        const [code, ex] = symbol.split(".");
        return (ex === "SH" ? "1." : "0.") + code;
      }
      function toTencent(symbol) {
        const [code, ex] = symbol.split(".");
        return (ex === "SH" ? "sh" : "sz") + code;
      }

      /********* 交易时段（北京时间） *********/
      function cnNow() {
        const now = new Date();
        const utc = now.getTime() + now.getTimezoneOffset() * 60000;
        return new Date(utc + 8 * 3600000);
      }
      function marketStateInfo() {
        const t = cnNow(),
          d = t.getDay(),
          hh = t.getHours() * 100 + t.getMinutes();
        const isWd = d >= 1 && d <= 5;
        let state = "休市";
        if (isWd) {
          if (hh < 930) state = "未开盘";
          else if (hh < 1130) state = "交易中";
          else if (hh < 1300) state = "午休";
          else if (hh < 1500) state = "交易中";
          else state = "已收盘";
        }
        return {
          state,
          ts: t.toLocaleString("zh-CN", {
            hour12: false,
            timeZone: "Asia/Shanghai",
          }),
        };
      }

      /********* 行情 & K线（东财优先，失败回退腾讯） *********/
      async function fetchQuote(symbol) {
        const url = `https://push2.eastmoney.com/api/qt/stock/get?secid=${secid(
          symbol
        )}&fields=f57,f58,f43,f44,f45,f46,f60,f168,f47,f48`;
        const r = await fetchWithTimeout(url, {
          headers: { Accept: "application/json" },
        });
        if (!r.ok) throw new Error("行情接口异常");
        const j = await r.json();
        const d = j?.data;
        if (!d || !d.f58) throw new Error("无此股票或数据不可用");
        return {
          symbol,
          code: d.f57,
          name: d.f58,
          price: d.f43 / 100,
          high: d.f44 / 100,
          low: d.f45 / 100,
          open: d.f46 / 100,
          prev: d.f60 / 100,
          pct: d.f168 / 100,
          vol: d.f47,
          amt: d.f48,
        };
      }
      async function fetchKline(symbol, limit = 220) {
        // A. 东方财富（带 ut）
        const urlA = `https://push2his.eastmoney.com/api/qt/stock/kline/get?ut=fa5fd1943c7b386f172d6893dbfba10b&secid=${secid(
          symbol
        )}&klt=101&fqt=1&lmt=${limit}&fields1=f1,f2,f3,f4&fields2=f51,f52,f53,f54,f55,f56,f59,f60,f61,f62,f63`;
        try {
          const r = await fetchWithTimeout(urlA);
          if (r.ok) {
            const j = await r.json();
            const arr = j?.data?.klines || [];
            if (arr.length) {
              return arr.map((s) => {
                const [date, open, close, high, low, vol, amt] = s.split(",");
                return {
                  date,
                  open: +open,
                  close: +close,
                  high: +high,
                  low: +low,
                  vol: +vol,
                  amt: +amt,
                };
              });
            }
          }
        } catch (_) {} // 回退
        // B. 腾讯
        const tc = toTencent(symbol);
        const urlB = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${tc},day,,,${limit},qfq`;
        const r2 = await fetchWithTimeout(urlB);
        if (!r2.ok) throw new Error("K线接口异常");
        const j2 = await r2.json();
        const rows = j2?.data?.[tc]?.day || j2?.data?.[tc]?.qfqday || [];
        if (!rows.length) throw new Error("K线不可用");
        return rows.map(([date, open, close, high, low, vol]) => ({
          date,
          open: +open,
          close: +close,
          high: +high,
          low: +low,
          vol: +vol,
          amt: 0,
        }));
      }

      /********* 指标 *********/
      function sma(v, p) {
        if (v.length < p) return NaN;
        const s = v.slice(-p);
        return s.reduce((a, b) => a + b, 0) / s.length;
      }
      function ema(v, p) {
        if (v.length < p) return NaN;
        const k = 2 / (p + 1);
        let e = v.slice(0, p).reduce((a, b) => a + b, 0) / p;
        for (let i = p; i < v.length; i++) e = v[i] * k + e * (1 - k);
        return e;
      }
      function rsi(v, p = 14) {
        if (v.length <= p) return 50;
        let g = 0,
          l = 0;
        for (let i = v.length - p; i < v.length; i++) {
          const d = v[i] - v[i - 1];
          if (d > 0) g += d;
          else l += -d;
        }
        const rs = l === 0 ? 100 : g / l;
        return 100 - 100 / (1 + rs);
      }
      function macd(v, fast = 12, slow = 26, sig = 9) {
        const emaS = (a, p) => {
          const k = 2 / (p + 1);
          const o = [];
          o[0] = a[0];
          for (let i = 1; i < a.length; i++)
            o[i] = a[i] * k + o[i - 1] * (1 - k);
          return o;
        };
        if (v.length < slow + sig) return { macd: 0, signal: 0, hist: 0 };
        const ef = emaS(v, fast),
          es = emaS(v, slow);
        const line = v.map((_, i) => (ef[i] ?? 0) - (es[i] ?? 0));
        const sg = emaS(line, sig);
        return {
          macd: line.at(-1),
          signal: sg.at(-1),
          hist: line.at(-1) - sg.at(-1),
        };
      }
      function atr(rows, p = 14) {
        if (rows.length <= p) return NaN;
        let trs = [];
        for (let i = 1; i < rows.length; i++) {
          const h = rows[i].high,
            l = rows[i].low,
            pc = rows[i - 1].close;
          trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
        }
        if (trs.length < p) return NaN;
        const s = trs.slice(-p);
        return s.reduce((a, b) => a + b, 0) / s.length;
      }

      /********* 决策 + 区间 *********/
      function decide(kline, quote, isST = false) {
        const closes = kline.map((r) => r.close),
          vols = kline.map((r) => r.vol),
          last = closes.at(-1);
        const ema20 = ema(closes, RULES.emaShort),
          sma50 = sma(closes, RULES.smaMid),
          sma200 = sma(closes, RULES.smaLong);
        const rsi14 = rsi(closes, RULES.rsiPeriod);
        const { macd: macdV, signal: macdSig } = macd(closes);
        const avgVol5 = vols.slice(-5).reduce((a, b) => a + b, 0) / 5;
        const volBurst = vols.at(-1) > avgVol5 * RULES.volBurst;
        const recentHigh = Math.max(...closes.slice(-20));
        const recentLow = Math.min(...closes.slice(-20));
        const atr14 = atr(kline, 14);

        let level = "HOLD",
          badge = "b-hold",
          label = "继续持有",
          reasons = [];
        if (last > ema20 && ema20 > sma50) {
          level = "BUY";
          badge = "b-buy";
          label = "建议买入";
          reasons.push("价格站上EMA20且EMA20>SMA50，趋势向上");
          if (volBurst) reasons.push("放量突破（>近5日均量）");
        }
        if (last < ema20 && (macdV < macdSig || ema20 < sma50)) {
          level = "SELL";
          badge = "b-sell";
          label = "建议卖出";
          reasons.push("收盘跌破EMA20且动能转弱（MACD死叉/20<50）");
        }
        if (rsi14 >= RULES.rsiOB) {
          if (level !== "SELL") {
            level = "HOLD";
            badge = "b-hold";
            label = "考虑减仓/等待回落";
          }
          reasons.push(`RSI 超买（≥${RULES.rsiOB}）`);
        }
        if (rsi14 <= RULES.rsiOS) {
          if (level === "SELL") {
            level = "WATCH";
            badge = "b-watch";
            label = "观望/等待企稳";
          }
          reasons.push(`RSI 超卖（≤${RULES.rsiOS}）`);
        }

        if (level === "BUY" && sma50 < sma200)
          reasons.push("中长期仍弱（SMA50 < SMA200），控制仓位");
        if (isST) reasons.push("ST 风险：流动性/涨跌停限制更严格");

        const buyLow = Math.max(recentLow, ema20 - 0.5 * (atr14 || 0));
        const buyHigh = Math.min(ema20, last);
        let sellLow, sellHigh;
        if (level === "SELL") {
          sellLow = Math.max(last * 0.98, ema20 - (atr14 || 0));
          sellHigh = Math.max(last, ema20 - 0.3 * (atr14 || 0));
        } else {
          sellLow = recentHigh * 0.99;
          sellHigh = recentHigh * 1.01;
        }

        const metrics = {
          price: last,
          ema20: r2(ema20),
          sma50: r2(sma50),
          sma200: r2(sma200),
          rsi14: r1(rsi14),
          macd: r3(macdV),
          signal: r3(macdSig),
          atr14: r2(atr14 || 0),
          recentHigh: r2(recentHigh),
          recentLow: r2(recentLow),
          buyLow: r2(buyLow),
          buyHigh: r2(buyHigh),
          sellLow: r2(sellLow),
          sellHigh: r2(sellHigh),
        };
        return { level, badge, label, reasons, metrics };
      }
      const r1 = (x) => Math.round(x * 10) / 10,
        r2 = (x) => Math.round(x * 100) / 100,
        r3 = (x) => Math.round(x * 1000) / 1000;

      /********* 渲染 *********/
      async function render() {
        const ms = marketStateInfo();
        marketState.textContent =
          ms.state + ` · 北京时间 ${ms.ts.split(" ")[1] || ms.ts}`;
        asof.textContent = `刷新时间：${new Date().toLocaleString()}`;
        tbody.innerHTML = "";
        let err = 0;
        await Promise.all(
          WATCHLIST.map((it) => renderOne(it, ms.state).catch(() => err++))
        );
        if (err) showToast(`有 ${err} 条加载失败`, false);
      }

      async function renderOne(item, state) {
        const tr = document.createElement("tr");
        tbody.appendChild(tr);
        try {
          const [q, kl] = await Promise.all([
            fetchQuote(item.symbol),
            fetchKline(item.symbol, 220),
          ]);
          item.name = item.name || q.name;
          saveWatchlist(WATCHLIST);

          const dec = decide(kl, q, !!item.st);

          // 涨跌幅：今日（只在交易时段显示）、昨日（K线最后两根）
          let todayStr = "—",
            todayColor = "#cbd5e1";
          if (state === "交易中") {
            const tchg = (((q.price - q.prev) / q.prev) * 100).toFixed(2);
            todayStr = (+tchg).toFixed(2) + "%";
            todayColor = +tchg >= 0 ? "#ef4444" : "#10b981";
          }
          let ydayStr = "—",
            yColor = "#cbd5e1";
          if (kl.length >= 2) {
            const last = kl.at(-1).close,
              prev = kl.at(-2).close;
            const y = (((last - prev) / prev) * 100).toFixed(2);
            ydayStr = y + "%";
            yColor = +y >= 0 ? "#ef4444" : "#10b981";
          }

          tr.innerHTML = `
      <td>${item.symbol}${item.st ? ' <span class="pill">ST</span>' : ""}</td>
      <td>${item.name || ""}</td>
      <td class="num">${(q.price || 0).toFixed(2)}</td>
      <td class="num">今日：<b style="color:${todayColor}">${todayStr}</b><br>昨日：<b style="color:${yColor}">${ydayStr}</b></td>
      <td><span class="badge ${dec.badge}">${dec.label}</span></td>
      <td><ul class="reasons">${dec.reasons
        .slice(0, 3)
        .map((r) => `<li>${r}</li>`)
        .join("")}</ul></td>
      <td class="muted">买：<b>${dec.metrics.buyLow}</b> — <b>${
            dec.metrics.buyHigh
          }</b><br/>卖：<b>${dec.metrics.sellLow}</b> — <b>${
            dec.metrics.sellHigh
          }</b></td>
      <td class="muted">EMA20 <b>${dec.metrics.ema20}</b> · SMA50 <b>${
            dec.metrics.sma50
          }</b> · SMA200 <b>${dec.metrics.sma200}</b> · RSI14 <b>${
            dec.metrics.rsi14
          }</b> · MACD <b>${dec.metrics.macd}</b> · ATR14 <b>${
            dec.metrics.atr14
          }</b></td>
      <td class="num"><span class="x" title="移除" data-symbol="${
        item.symbol
      }">✕</span></td>
    `;
        } catch (e) {
          tr.innerHTML = `<td colspan="9" class="err">${
            item.symbol
          } 加载失败：${e.message || e}</td>`;
        }
      }

      /********* 交互：添加 / 删除 / 刷新 *********/
      const addBtn = document.getElementById("addBtn");
      const addInput = document.getElementById("addInput");
      addBtn.addEventListener("click", onAdd);
      addInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") onAdd();
      });
      document.addEventListener("click", (e) => {
        if (e.target.matches(".x[data-symbol]")) {
          const sym = e.target.getAttribute("data-symbol");
          WATCHLIST = WATCHLIST.filter((it) => it.symbol !== sym);
          saveWatchlist(WATCHLIST);
          showToast(`已从自选移除：${sym}`);
          render();
        }
      });
      async function onAdd() {
        const parsed = parseInput(addInput.value);
        if (!parsed) {
          showToast(
            "代码格式错误：请输入 6 位代码，或 600519.SH / 300750.SZ",
            false
          );
          return;
        }
        if (WATCHLIST.some((it) => it.symbol === parsed)) {
          showToast("该股票已在自选中");
          return;
        }
        try {
          const q = await fetchQuote(parsed); // 校验
          WATCHLIST.unshift({ symbol: parsed, name: q.name });
          saveWatchlist(WATCHLIST);
          showToast(`已加入：${q.name}（${parsed}）`);
          addInput.value = "";
          render();
        } catch (err) {
          showToast(err.message || "该代码不存在或暂不可用", false);
        }
      }
      const btn = document.getElementById("refreshBtn");
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "刷新中…";
        await render();
        btn.disabled = false;
        btn.textContent = "立即刷新";
      });
      render();
      setInterval(render, 60 * 1000);
    </script>
  </body>
</html>
